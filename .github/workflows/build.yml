name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read version
        run: |
          VERSION=$(grep -oP 'val appVersion = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Stellar Disc v$VERSION"

      # Optional but recommended: a fixed signing key so new builds install over old ones.
      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret set. Using a throwaway key, so you must uninstall before installing each new build. See README."
          fi

      # Quick checks of the fiddly logic (rotation, title fixing, Swap matching, backups).
      # If any fail, the build stops here and nothing is released.
      - name: Run tests
        run: gradle testReleaseUnitTest --no-daemon --stacktrace

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "StellarDisc-v${VERSION}.apk"

      # Early warning for phones that use 16 KB memory pages (Android 15+). Native parts built
      # the old way fail to load there. This never blocks a release; it reports in the run summary.
      - name: Check 16 KB page support
        continue-on-error: true
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK" ]; then NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1); fi
          READELF=$(ls "$NDK"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)
          rm -rf "$RUNNER_TEMP/apklibs" && mkdir -p "$RUNNER_TEMP/apklibs"
          unzip -q -o "StellarDisc-v${VERSION}.apk" 'lib/*' -d "$RUNNER_TEMP/apklibs" || true
          {
            echo "## 16 KB page check"
            echo ""
            echo "| Library | Ready |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          BAD=0
          for so in $(find "$RUNNER_TEMP/apklibs" -name '*.so' | sort); do
            name=$(basename "$so")
            # Some "libraries" are really zipped Python files; only real ELF files matter here.
            if [ "$(head -c 4 "$so" | od -An -tx1 | tr -d ' \n')" != "7f454c46" ]; then continue; fi
            MIN=$("$READELF" -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort | head -1)
            if [ -n "$MIN" ] && [ $((MIN)) -ge 16384 ]; then
              echo "| $name | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $name | ⚠️ align $MIN |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$name isn't 16 KB page ready (align $MIN). It may not load on 16 KB phones."
              BAD=$((BAD+1))
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$BAD library(ies) not 16 KB ready." >> "$GITHUB_STEP_SUMMARY"

      # Tells you when the downloader library has a newer release (often with fixes like 16 KB support).
      - name: Check for downloader library updates
        continue-on-error: true
        run: |
          CURRENT=$(grep -oP 'val youtubedlAndroid = "\K[^"]+' app/build.gradle.kts)
          LATEST=$(curl -fsSL https://repo1.maven.org/maven2/io/github/junkfood02/youtubedl-android/library/maven-metadata.xml | grep -oP '<release>\K[^<]+' | head -1)
          echo "youtubedl-android: using $CURRENT, newest is $LATEST"
          if [ -n "$LATEST" ] && [ "$LATEST" != "$CURRENT" ]; then
            echo "::notice::youtubedl-android $LATEST is available (you use $CURRENT). Ask Claude to update it in app/build.gradle.kts."
            echo "### youtubedl-android $LATEST is available (using $CURRENT)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: StellarDisc-v${{ env.VERSION }}
          path: StellarDisc-v${{ env.VERSION }}.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v${VERSION}" -y --cleanup-tag || true
          gh release create "v${VERSION}" "StellarDisc-v${VERSION}.apk" \
            --title "v${VERSION}" \
            --notes ""

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
