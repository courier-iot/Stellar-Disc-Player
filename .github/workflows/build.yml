name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # QuickJS-NG: the JavaScript runtime yt-dlp needs for YouTube.
      # Compiled for 64-bit Android and packed into the APK. If this step fails,
      # the app still builds and simply runs without it.
      - name: Build QuickJS-NG for Android
        continue-on-error: true
        run: |
          set -e
          QJS_TAG=v0.16.2
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK" ]; then NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1); fi
          echo "Using NDK at $NDK"
          git clone --depth 1 --branch "$QJS_TAG" https://github.com/quickjs-ng/quickjs.git "$RUNNER_TEMP/quickjs"
          cmake -S "$RUNNER_TEMP/quickjs" -B "$RUNNER_TEMP/qjs-build" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build "$RUNNER_TEMP/qjs-build" --target qjs_exe -j 4 || cmake --build "$RUNNER_TEMP/qjs-build" -j 4
          QJS=$(find "$RUNNER_TEMP/qjs-build" -maxdepth 2 -type f -name qjs | head -1)
          test -n "$QJS"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          # Android only lets apps run programs packed as native libraries, hence the lib*.so name.
          cp "$QJS" app/src/main/jniLibs/arm64-v8a/libqjs.so
          file app/src/main/jniLibs/arm64-v8a/libqjs.so || true
          echo "QuickJS-NG $QJS_TAG packed into the APK"

      - name: Read version
        run: |
          VERSION=$(grep -oP 'val appVersion = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Stellar Disc v$VERSION"

      # Optional but recommended: a fixed signing key so new builds install over old ones.
      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret set. Using a throwaway key, so you must uninstall before installing each new build. See README."
          fi

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "StellarDisc-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: StellarDisc-v${{ env.VERSION }}
          path: StellarDisc-v${{ env.VERSION }}.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v${VERSION}" -y --cleanup-tag || true
          gh release create "v${VERSION}" "StellarDisc-v${VERSION}.apk" \
            --title "v${VERSION}" \
            --notes ""

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
